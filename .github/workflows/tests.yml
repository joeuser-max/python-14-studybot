name: ClassPulse tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: 檢查 macOS 啟動器的 Shell 語法
        run: bash -n start_mac.sh
      - name: Run offline tests
        run: python -m pytest -q
      - name: 檢查 Python 語法
        run: python -m compileall -q app.py ai_assistant.py line_bot.py reminder_worker.py calendar_events.py
      - name: 驗證 Streamlit 網頁 HTTP 服務可啟動
        run: |
          python -m streamlit run app.py --server.headless true --server.port 8501 > /tmp/classpulse-streamlit.log 2>&1 &
          streamlit_pid=$!
          trap 'kill "$streamlit_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl --fail --silent http://localhost:8501/_stcore/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/classpulse-streamlit.log
          exit 1

  windows-launcher-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 檢查 Windows PowerShell 快速啟動器語法
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $path = (Resolve-Path '.\start_windows.ps1').Path
          [System.Management.Automation.Language.Parser]::ParseFile(
            $path, [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
